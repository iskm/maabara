apiVersion: v1
kind: Namespace
metadata:
  name: eso-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: eso-demo
---
# A SecretStore is tied to one Vault KV mount. This store reads from kv/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-kv-v1
  namespace: eso-demo
spec:
  provider:
    vault:
      server: https://vault1.homelab.test:8200
      path: kv
      version: v1
      caProvider:
        type: Secret
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-k3s
          role: eso-demo
          serviceAccountRef:
            name: eso-vault-auth
            audiences:
              - vault
---
# A second store is required because shared-kv/ is a different Vault mount.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-shared-kv-v1
  namespace: eso-demo
spec:
  provider:
    vault:
      server: https://vault1.homelab.test:8200
      path: shared-kv
      version: v1
      caProvider:
        type: Secret
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-k3s
          role: eso-demo
          serviceAccountRef:
            name: eso-vault-auth
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: combined-demo-config
  namespace: eso-demo
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  target:
    name: combined-demo-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: eso-demo

  # Entries are merged from top to bottom into one Kubernetes Secret.
  # A later entry wins when the same key occurs more than once.
  dataFrom:
    - extract:
        key: apps/eso/base
      sourceRef:
        storeRef:
          name: vault-kv-v1
          kind: SecretStore

    - extract:
        key: apps/eso/database
      sourceRef:
        storeRef:
          name: vault-kv-v1
          kind: SecretStore

    - extract:
        key: platform/eso
      sourceRef:
        storeRef:
          name: vault-shared-kv-v1
          kind: SecretStore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-demo-app
  namespace: eso-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eso-demo-app
  template:
    metadata:
      labels:
        app: eso-demo-app
    spec:
      serviceAccountName: eso-vault-auth
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              test -s /run/secrets/combined/app_username
              test -s /run/secrets/combined/database_password
              test -s /run/secrets/combined/region
              echo "all combined secret files are present"
              sleep 3600
          volumeMounts:
            - name: combined-config
              mountPath: /run/secrets/combined
              readOnly: true
      volumes:
        - name: combined-config
          secret:
            secretName: combined-demo-config
            defaultMode: 0400
