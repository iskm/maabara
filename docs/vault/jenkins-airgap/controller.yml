---
- name: Deploy an air-gapped Jenkins controller container
  hosts: jenkins_controller
  become: true
  gather_facts: true

  vars:
    container_engine: docker
    # auto uses community.docker for Docker and the CLI fallback for Podman.
    # Set cli explicitly only when the Docker modules cannot be used.
    container_image_backend: auto
    jenkins_controller_image: "registry.internal.example/jenkins/controller:lts"
    jenkins_controller_image_archive: ""
    # never: require a preloaded image; missing: pull only if absent; always: refresh it.
    jenkins_controller_image_pull_policy: missing
    container_registry_server: ""
    container_registry_username: ""
    container_registry_password: ""
    jenkins_controller_registry_auth_dir: /run/jenkins-controller-registry-auth-ansible
    jenkins_controller_container_name: jenkins-controller

    jenkins_controller_config_dir: /etc/jenkins-controller
    jenkins_controller_home: /srv/jenkins/controller
    jenkins_controller_image_cache_dir: /var/cache/jenkins-images
    jenkins_controller_uid: 1000
    jenkins_controller_gid: 1000

    jenkins_controller_host_port: 8443
    jenkins_controller_container_port: 8443
    jenkins_controller_url: "https://{{ inventory_hostname }}:{{ jenkins_controller_host_port }}"

    # Required local files on the Ansible control node.
    jenkins_controller_tls_certificate_file: ""
    jenkins_controller_tls_private_key_file: ""
    jenkins_controller_trusted_ca_files: []
    # Example:
    # jenkins_controller_trusted_ca_files:
    #   - alias: homelab-root
    #     src: files/homelab-root-ca.crt

    # Put this value in an Ansible Vault-encrypted vars file.
    jenkins_controller_keystore_password: ""

    # Optional local Jenkins Configuration as Code file.
    jenkins_controller_jcasc_file: ""
    jenkins_controller_java_opts_extra: "-Djava.awt.headless=true"
    jenkins_controller_extra_environment: {}
    jenkins_controller_extra_bind_mounts: []
    # Example:
    # jenkins_controller_extra_bind_mounts:
    #   - source: /srv/jenkins/shared
    #     target: /opt/jenkins/shared
    #     options: ro,Z

  pre_tasks:
    - name: Validate controller inputs
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "RedHat"
          - container_engine in ["docker", "podman"]
          - container_image_backend in ["auto", "modules", "cli"]
          - not (container_image_backend == "modules" and container_engine != "docker")
          - jenkins_controller_image | length > 0
          - jenkins_controller_image_pull_policy in ["never", "missing", "always"]
          - >-
            not (jenkins_controller_image_archive | length > 0 and
            jenkins_controller_image_pull_policy != "never")
          - >-
            (container_registry_username | length == 0 and
            container_registry_password | length == 0) or
            (container_registry_server | length > 0 and
            container_registry_username | length > 0 and
            container_registry_password | length > 0)
          - jenkins_controller_tls_certificate_file | length > 0
          - jenkins_controller_tls_private_key_file | length > 0
          - jenkins_controller_trusted_ca_files | length > 0
          - jenkins_controller_keystore_password | length >= 12
          - jenkins_controller_keystore_password is match('^[A-Za-z0-9._~-]+$')
        fail_msg: >-
          This play requires a Red Hat-family host, docker or podman, a
          controller image source, a TLS certificate/key, at least one trusted
          CA, and a 12+ character keystore password made from letters, digits,
          dot, underscore, tilde, or hyphen. Archive and registry-pull modes
          are mutually exclusive. Registry server, username, and password must
          either all be supplied or all be empty.
    - name: Check trusted CA definitions
      ansible.builtin.assert:
        that:
          - item.alias is match('^[A-Za-z0-9_.-]+$')
          - item.src | length > 0
        fail_msg: "Every trusted CA needs a simple alias and a local src path."
      loop: "{{ jenkins_controller_trusted_ca_files }}"
      loop_control:
        label: "{{ item.alias | default('undefined') }}"

  tasks:
    - name: Install certificate and Java tooling from configured RHEL repositories
      ansible.builtin.package:
        name:
          - ca-certificates
          - java-21-openjdk-headless
          - openssl
          - python3-requests
        state: present

    - name: Locate the selected container engine
      ansible.builtin.shell: "command -v {{ container_engine }}"
      args:
        executable: /bin/bash
      register: controller_engine_path
      changed_when: false

    - name: Create controller directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ jenkins_controller_config_dir }}"
          owner: root
          group: root
          mode: "0750"
        - path: "{{ jenkins_controller_config_dir }}/tls"
          owner: root
          group: "{{ jenkins_controller_gid }}"
          mode: "0750"
        - path: "{{ jenkins_controller_config_dir }}/ca"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ jenkins_controller_home }}"
          owner: "{{ jenkins_controller_uid }}"
          group: "{{ jenkins_controller_gid }}"
          mode: "0750"
        - path: "{{ jenkins_controller_image_cache_dir }}"
          owner: root
          group: root
          mode: "0750"

    - name: Copy the controller TLS certificate
      ansible.builtin.copy:
        src: "{{ jenkins_controller_tls_certificate_file }}"
        dest: "{{ jenkins_controller_config_dir }}/tls/server.crt"
        owner: root
        group: root
        mode: "0644"
      register: controller_certificate_copy

    - name: Copy the controller TLS private key
      ansible.builtin.copy:
        src: "{{ jenkins_controller_tls_private_key_file }}"
        dest: "{{ jenkins_controller_config_dir }}/tls/server.key"
        owner: root
        group: root
        mode: "0600"
      register: controller_private_key_copy
      no_log: true

    - name: Copy trusted CA certificates for the controller JVM
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ jenkins_controller_config_dir }}/ca/{{ item.alias }}.crt"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ jenkins_controller_trusted_ca_files }}"
      loop_control:
        label: "{{ item.alias }}"
      notify: Restart Jenkins controller

    - name: Assemble the controller container PEM CA bundle
      ansible.builtin.assemble:
        src: "{{ jenkins_controller_config_dir }}/ca"
        dest: "{{ jenkins_controller_config_dir }}/tls/ca-bundle.pem"
        delimiter: "\n"
        owner: root
        group: "{{ jenkins_controller_gid }}"
        mode: "0644"
      notify: Restart Jenkins controller

    - name: Install trusted CAs into the RHEL host trust store
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/etc/pki/ca-trust/source/anchors/jenkins-{{ item.alias }}.crt"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ jenkins_controller_trusted_ca_files }}"
      loop_control:
        label: "{{ item.alias }}"
      register: controller_host_ca_copy

    - name: Refresh host CA trust before accessing an internal registry
      ansible.builtin.command: update-ca-trust
      when: controller_host_ca_copy.changed
      changed_when: true

    - name: Build the dedicated controller Java truststore
      community.general.java_cert:
        cert_path: "{{ jenkins_controller_config_dir }}/ca/{{ item.alias }}.crt"
        cert_alias: "{{ item.alias }}"
        keystore_path: "{{ jenkins_controller_config_dir }}/tls/truststore.jks"
        keystore_pass: "{{ jenkins_controller_keystore_password }}"
        keystore_create: true
        keystore_type: JKS
        trust_cacert: true
        state: present
        owner: root
        group: "{{ jenkins_controller_gid }}"
        mode: "0640"
      loop: "{{ jenkins_controller_trusted_ca_files }}"
      loop_control:
        label: "{{ item.alias }}"
      no_log: true
      notify: Restart Jenkins controller

    - name: Check for an existing HTTPS server keystore
      ansible.builtin.stat:
        path: "{{ jenkins_controller_config_dir }}/tls/server.p12"
      register: controller_server_keystore

    - name: Build the controller HTTPS PKCS#12 keystore
      ansible.builtin.command:
        argv:
          - openssl
          - pkcs12
          - -export
          - -name
          - jenkins
          - -in
          - "{{ jenkins_controller_config_dir }}/tls/server.crt"
          - -inkey
          - "{{ jenkins_controller_config_dir }}/tls/server.key"
          - -out
          - "{{ jenkins_controller_config_dir }}/tls/server.p12"
          - -passout
          - "pass:{{ jenkins_controller_keystore_password }}"
      when: >-
        controller_certificate_copy.changed or
        controller_private_key_copy.changed or
        not controller_server_keystore.stat.exists
      no_log: true
      notify: Restart Jenkins controller

    - name: Protect the generated controller keystores
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: "{{ jenkins_controller_gid }}"
        mode: "0640"
      loop:
        - "{{ jenkins_controller_config_dir }}/tls/server.p12"
        - "{{ jenkins_controller_config_dir }}/tls/truststore.jks"

    - name: Install optional Jenkins Configuration as Code
      ansible.builtin.copy:
        src: "{{ jenkins_controller_jcasc_file }}"
        dest: "{{ jenkins_controller_home }}/jenkins.yaml"
        owner: "{{ jenkins_controller_uid }}"
        group: "{{ jenkins_controller_gid }}"
        mode: "0640"
      when: jenkins_controller_jcasc_file | length > 0
      notify: Restart Jenkins controller

    - name: Copy an optional air-gapped controller image archive
      ansible.builtin.copy:
        src: "{{ jenkins_controller_image_archive }}"
        dest: "{{ jenkins_controller_image_cache_dir }}/{{ jenkins_controller_image_archive | basename }}"
        owner: root
        group: root
        mode: "0640"
      when: jenkins_controller_image_archive | length > 0
      register: controller_archive_copy

    - name: Select the controller image-management backend
      ansible.builtin.set_fact:
        controller_use_docker_modules: >-
          {{
            container_engine == "docker" and
            container_image_backend in ["auto", "modules"]
          }}

    - name: Inspect the controller image with community.docker
      community.docker.docker_image_info:
        name: "{{ jenkins_controller_image }}"
      when: controller_use_docker_modules | bool
      register: controller_docker_image_info

    - name: Inspect the controller image with the CLI fallback
      ansible.builtin.command:
        argv:
          - "{{ controller_engine_path.stdout }}"
          - image
          - inspect
          - "{{ jenkins_controller_image }}"
      when: not controller_use_docker_modules | bool
      register: controller_cli_image_info
      changed_when: false
      failed_when: false

    - name: Record whether the controller image is present
      ansible.builtin.set_fact:
        controller_image_present: >-
          {{
            (controller_docker_image_info.images | length > 0)
            if controller_use_docker_modules | bool
            else (controller_cli_image_info.rc == 0)
          }}

    - name: Load the controller archive with community.docker
      community.docker.docker_image_load:
        path: "{{ jenkins_controller_image_cache_dir }}/{{ jenkins_controller_image_archive | basename }}"
      when:
        - controller_use_docker_modules | bool
        - jenkins_controller_image_archive | length > 0
        - controller_archive_copy.changed or not controller_image_present | bool
      notify: Restart Jenkins controller

    - name: Load the controller archive with the CLI fallback
      ansible.builtin.command:
        argv:
          - "{{ controller_engine_path.stdout }}"
          - load
          - --input
          - "{{ jenkins_controller_image_cache_dir }}/{{ jenkins_controller_image_archive | basename }}"
      when:
        - not controller_use_docker_modules | bool
        - jenkins_controller_image_archive | length > 0
        - controller_archive_copy.changed or not controller_image_present | bool
      changed_when: true
      notify: Restart Jenkins controller

    - name: Decide whether the controller image needs a registry pull
      ansible.builtin.set_fact:
        controller_registry_pull_required: >-
          {{
            jenkins_controller_image_archive | length == 0 and
            (
              jenkins_controller_image_pull_policy == "always" or
              (
                jenkins_controller_image_pull_policy == "missing" and
                not controller_image_present | bool
              )
            )
          }}

    - name: Pull the controller image anonymously with community.docker
      community.docker.docker_image_pull:
        name: "{{ jenkins_controller_image }}"
        pull: "{{ 'always' if jenkins_controller_image_pull_policy == 'always' else 'not_present' }}"
      when:
        - controller_use_docker_modules | bool
        - controller_registry_pull_required | bool
        - container_registry_username | length == 0
      notify: Restart Jenkins controller

    - name: Pull the controller image anonymously with the CLI fallback
      ansible.builtin.command:
        argv:
          - "{{ controller_engine_path.stdout }}"
          - pull
          - "{{ jenkins_controller_image }}"
      when:
        - not controller_use_docker_modules | bool
        - controller_registry_pull_required | bool
        - container_registry_username | length == 0
      changed_when: true
      notify: Restart Jenkins controller

    - name: Pull the controller image with community.docker authentication
      when:
        - controller_use_docker_modules | bool
        - controller_registry_pull_required | bool
        - container_registry_username | length > 0
      block:
        - name: Authenticate community.docker to the internal registry
          community.docker.docker_login:
            registry_url: "{{ container_registry_server }}"
            username: "{{ container_registry_username }}"
            password: "{{ container_registry_password }}"
            reauthorize: true
          no_log: true

        - name: Pull the authenticated controller image with community.docker
          community.docker.docker_image_pull:
            name: "{{ jenkins_controller_image }}"
            pull: "{{ 'always' if jenkins_controller_image_pull_policy == 'always' else 'not_present' }}"
          notify: Restart Jenkins controller
      always:
        - name: Remove the temporary community.docker registry login
          community.docker.docker_login:
            registry_url: "{{ container_registry_server }}"
            state: absent
          no_log: true

    - name: Pull the controller image with CLI-fallback credentials
      when:
        - not controller_use_docker_modules | bool
        - controller_registry_pull_required | bool
        - container_registry_username | length > 0
      block:
        - name: Create the temporary controller registry-auth directory
          ansible.builtin.file:
            path: "{{ jenkins_controller_registry_auth_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Authenticate Docker to the internal registry
          ansible.builtin.command:
            argv:
              - "{{ controller_engine_path.stdout }}"
              - --config
              - "{{ jenkins_controller_registry_auth_dir }}"
              - login
              - --username
              - "{{ container_registry_username }}"
              - --password-stdin
              - "{{ container_registry_server }}"
            stdin: "{{ container_registry_password }}"
            stdin_add_newline: true
          when: container_engine == "docker"
          changed_when: false
          no_log: true

        - name: Authenticate Podman to the internal registry
          ansible.builtin.command:
            argv:
              - "{{ controller_engine_path.stdout }}"
              - login
              - --authfile
              - "{{ jenkins_controller_registry_auth_dir }}/auth.json"
              - --username
              - "{{ container_registry_username }}"
              - --password-stdin
              - "{{ container_registry_server }}"
            stdin: "{{ container_registry_password }}"
            stdin_add_newline: true
          when: container_engine == "podman"
          changed_when: false
          no_log: true

        - name: Pull the authenticated controller image with Docker
          ansible.builtin.command:
            argv:
              - "{{ controller_engine_path.stdout }}"
              - --config
              - "{{ jenkins_controller_registry_auth_dir }}"
              - pull
              - "{{ jenkins_controller_image }}"
          when: container_engine == "docker"
          changed_when: true
          notify: Restart Jenkins controller

        - name: Pull the authenticated controller image with Podman
          ansible.builtin.command:
            argv:
              - "{{ controller_engine_path.stdout }}"
              - pull
              - --authfile
              - "{{ jenkins_controller_registry_auth_dir }}/auth.json"
              - "{{ jenkins_controller_image }}"
          when: container_engine == "podman"
          changed_when: true
          notify: Restart Jenkins controller
      always:
        - name: Remove temporary controller registry credentials
          ansible.builtin.file:
            path: "{{ jenkins_controller_registry_auth_dir }}"
            state: absent
          no_log: true

    - name: Verify the controller image with community.docker
      community.docker.docker_image_info:
        name: "{{ jenkins_controller_image }}"
      when: controller_use_docker_modules | bool
      register: controller_final_docker_image_info

    - name: Confirm the community.docker image lookup succeeded
      ansible.builtin.assert:
        that: controller_final_docker_image_info.images | length == 1
        fail_msg: "The requested controller image is not present after image management."
      when: controller_use_docker_modules | bool

    - name: Verify the controller image with the CLI fallback
      ansible.builtin.command:
        argv:
          - "{{ controller_engine_path.stdout }}"
          - image
          - inspect
          - "{{ jenkins_controller_image }}"
      when: not controller_use_docker_modules | bool
      changed_when: false

    - name: Render the controller container environment
      ansible.builtin.template:
        src: templates/jenkins-controller.env.j2
        dest: "{{ jenkins_controller_config_dir }}/controller.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart Jenkins controller

    - name: Install the Jenkins controller systemd unit
      ansible.builtin.template:
        src: templates/jenkins-controller.service.j2
        dest: /etc/systemd/system/jenkins-controller.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Jenkins controller

    - name: Apply trust and service handlers before startup
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the Jenkins controller
      ansible.builtin.systemd_service:
        name: jenkins-controller.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for the Jenkins HTTPS port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ jenkins_controller_host_port }}"
        timeout: 180

    - name: Verify the Jenkins login endpoint and its certificate
      ansible.builtin.uri:
        url: "{{ jenkins_controller_url }}/login"
        method: GET
        status_code: 200
        validate_certs: true
        return_content: false
      register: controller_https_check
      retries: 12
      delay: 5
      until: controller_https_check.status == 200

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Jenkins controller
      ansible.builtin.systemd_service:
        name: jenkins-controller.service
        state: restarted
