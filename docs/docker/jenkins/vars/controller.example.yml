---
# Copy this file, fill it in, and encrypt the copy with ansible-vault.
container_engine: docker
container_image_backend: auto

# Use the exact fully qualified name in the internal registry.
jenkins_controller_image: "registry.internal.example/jenkins/controller:lts-jdk21"
jenkins_controller_image_pull_policy: missing

# Leave all three empty for anonymous access. Encrypt this file if credentials
# are supplied.
container_registry_server: ""
container_registry_username: ""
container_registry_password: ""

# Archive mode is an alternative: set pull policy to never and provide a file.
jenkins_controller_image_archive: ""

# image = CAs were baked into the image; runtime = Ansible generates and
# mounts OS and Java trust; both = runtime trust overlays baked trust.
jenkins_controller_ca_mode: runtime
# UBI/RHEL image path. For Debian-based images use
# /etc/ssl/certs/ca-certificates.crt.
jenkins_controller_container_os_ca_bundle_path: /etc/pki/tls/certs/ca-bundle.crt

jenkins_controller_tls_certificate_file: "files/jenkins.homelab.test.fullchain.crt"
jenkins_controller_tls_private_key_file: "files/jenkins.homelab.test.key"
jenkins_controller_trusted_ca_files:
  - alias: homelab-root
    src: files/homelab-root-ca.crt
  - alias: microsoft-issuing-01
    src: files/microsoft-issuing-01.pem

jenkins_controller_keystore_password: "REPLACE-WITH-ANSIBLE-VAULT"
jenkins_controller_bind_address: 0.0.0.0
jenkins_controller_host_port: 8443
jenkins_controller_container_port: 8443
jenkins_controller_url: "https://jenkins.homelab.test:8443"
jenkins_controller_manage_firewall: false
jenkins_controller_firewall_zone: public

# Requires the Configuration as Code plugin to be baked into the image.
jenkins_controller_jcasc_file: "casc/jenkins.example.yaml"

jenkins_controller_extra_bind_mounts: []
